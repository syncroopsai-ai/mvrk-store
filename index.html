<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MVRK STORE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#a3e635',
            darkbg: '#0f172a'
          }
        }
      }
    }
  </script>
  <style>
    body { user-select: none; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-200 min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur border-b border-gray-200 dark:border-slate-800">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="window.scrollTo({top:0, behavior:'smooth'})">
        <span class="w-3 h-3 rounded-full bg-brand"></span>
        <h1 class="text-xl font-extrabold tracking-wider">MVRK STORE</h1>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="toggleDarkMode()" class="p-2 rounded-full bg-gray-100 dark:bg-slate-800 text-lg">🌙</button>
        <button onclick="toggleCart()" class="bg-slate-900 dark:bg-brand dark:text-slate-950 text-white px-4 py-2 rounded-full font-bold flex items-center gap-2">
          🛒 Кошик <span id="cart-count" class="bg-brand text-slate-950 px-2 py-0.5 rounded-full text-xs font-black">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Hero Banner -->
  <section class="max-w-6xl mx-auto px-4 py-8">
    <div class="bg-slate-950 text-white rounded-3xl p-8 md:p-12 relative overflow-hidden flex flex-col justify-between min-h-[300px]">
      <div class="max-w-md z-10">
        <span class="text-xs font-bold uppercase tracking-widest text-brand bg-brand/10 px-3 py-1 rounded-full border border-brand/20">Нова колекція 2026</span>
        <h2 class="text-4xl md:text-5xl font-black mt-4 leading-tight">Одяг, який говорить сам.</h2>
        <p class="text-gray-400 mt-2">Streetwear без зайвого шуму: щільні тканини, чисті силуети.</p>
        <button onclick="scrollToCatalog()" class="mt-6 bg-brand text-slate-950 font-bold px-6 py-3 rounded-xl hover:opacity-90 transition">Дивитись колекцію ↓</button>
      </div>
    </div>
  </section>

  <!-- Catalog -->
  <main id="catalog-section" class="max-w-6xl mx-auto px-4 py-8">
    <h3 class="text-2xl font-bold mb-6">Каталог товарів</h3>
    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
  </main>

  <!-- Order Form Section -->
  <section class="max-w-6xl mx-auto px-4 py-12">
    <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 md:p-10 shadow-sm border border-gray-100 dark:border-slate-700/50 max-w-2xl mx-auto">
      <h3 class="text-2xl font-bold mb-2">Швидке замовлення</h3>
      <p class="text-gray-500 dark:text-gray-400 text-sm mb-6">Оберіть товари з каталогу вище або додайте їх у кошик для оформлення.</p>
      
      <form id="order-form" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-bold mb-1">Ім'я *</label>
            <input type="text" id="customer-name" required class="w-full px-4 py-2 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 focus:outline-none focus:border-brand" placeholder="Ваше ім'я">
          </div>
          <div>
            <label class="block text-sm font-bold mb-1">Email *</label>
            <input type="email" id="customer-email" required class="w-full px-4 py-2 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 focus:outline-none focus:border-brand" placeholder="example@gmail.com">
          </div>
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">Телефон</label>
          <input type="tel" id="customer-phone" class="w-full px-4 py-2 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 focus:outline-none focus:border-brand" placeholder="+380...">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">Коментар</label>
          <textarea id="customer-comment" rows="3" class="w-full px-4 py-2 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 focus:outline-none focus:border-brand" placeholder="Побажання щодо замовлення..."></textarea>
        </div>

        <button type="submit" class="w-full bg-brand text-slate-950 font-bold py-3 rounded-xl hover:opacity-90 transition mt-2">
          Підтвердити замовлення
        </button>
        <div id="form-message" class="text-sm font-medium mt-2 hidden text-center"></div>
      </form>
    </div>
  </section>

  <!-- Cart Modal -->
  <div id="cart-modal" class="fixed inset-0 bg-black/50 z-50 hidden backdrop-blur-sm flex justify-end">
    <div class="bg-white dark:bg-slate-900 w-full max-w-md h-full p-6 flex flex-col justify-between shadow-2xl">
      <div>
        <div class="flex justify-between items-center mb-6">
          <h3 class="text-xl font-bold">Ваш кошик</h3>
          <button onclick="toggleCart()" class="text-2xl">&times;</button>
        </div>
        <div id="cart-items" class="space-y-4 max-h-[60vh] overflow-y-auto"></div>
      </div>
      <div class="border-t border-gray-200 dark:border-slate-800 pt-4">
        <div class="flex justify-between font-bold text-lg mb-4">
          <span>Разом:</span>
          <span id="cart-total">0 ₴</span>
        </div>
        <button onclick="scrollToFormFromCart()" class="w-full bg-brand text-slate-950 py-3 rounded-xl font-bold hover:opacity-90 transition">Перейти до оформлення</button>
      </div>
    </div>
  </div>

  <script>
    const WEBHOOK_URL = "https://hook.eu1.make.com/dhynvsnjuc4shnwif81xsfvzbmn3s9bu";

    const products = [
      { id: 1, sku: "P1", name: "Худі MVRK Heavyweight", price: 2490, img: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=500" },
      { id: 2, sku: "P2", name: "Світшот Basic Oversize", price: 1890, img: "https://images.unsplash.com/photo-1578587018452-892bacefd3f2?w=500" },
      { id: 3, sku: "P3", name: "Футболка MVRK Core", price: 990, img: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500" },
      { id: 4, sku: "P4", name: "Штани Cargo Black", price: 2190, img: "https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=500" }
    ];

    let cart = [];

    function renderProducts() {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = products.map(p => `
        <div class="bg-white dark:bg-slate-800 rounded-2xl overflow-hidden shadow-sm border border-gray-100 dark:border-slate-700/50 flex flex-col justify-between">
          <img src="${p.img}" alt="${p.name}" class="w-full h-64 object-cover">
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <h4 class="font-bold text-lg">${p.name}</h4>
              <p class="text-brand font-black text-xl mt-1">${p.price} ₴</p>
            </div>
            <button onclick="addToCart(${p.id})" class="mt-4 w-full bg-slate-900 dark:bg-brand text-white dark:text-slate-950 font-bold py-2 rounded-xl hover:opacity-90 transition">
              + В кошик
            </button>
          </div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const item = products.find(p => p.id === id);
      const existing = cart.find(i => i.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...item, qty: 1 });
      }
      updateCart();
    }

    function updateCart() {
      const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cart-count').innerText = totalCount;
      const cartItems = document.getElementById('cart-items');
      if (cart.length === 0) {
        cartItems.innerHTML = '<p class="text-gray-400 text-center py-8">Кошик порожній</p>';
      } else {
        cartItems.innerHTML = cart.map((item, idx) => `
          <div class="flex justify-between items-center border-b border-gray-100 dark:border-slate-800 pb-2">
            <div>
              <p class="font-bold text-sm">${item.name}</p>
              <p class="text-xs text-brand font-bold">${item.price} ₴ × ${item.qty}</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="changeQty(${idx}, 1)" class="px-2 py-0.5 bg-gray-100 dark:bg-slate-800 rounded font-bold">+</button>
              <button onclick="changeQty(${idx}, -1)" class="px-2 py-0.5 bg-gray-100 dark:bg-slate-800 rounded font-bold">-</button>
              <button onclick="removeFromCart(${idx})" class="text-red-500 text-xs ml-2">Видалити</button>
            </div>
          </div>
        `).join('');
      }
      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      document.getElementById('cart-total').innerText = `${total} ₴`;
    }

    function changeQty(idx, delta) {
      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) {
        cart.splice(idx, 1);
      }
      updateCart();
    }

    function removeFromCart(idx) {
      cart.splice(idx, 1);
      updateCart();
    }

    function toggleCart() {
      document.getElementById('cart-modal').classList.toggle('hidden');
    }

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
    }

    function scrollToCatalog() {
      document.getElementById('catalog-section').scrollIntoView({ behavior: 'smooth' });
    }

    function scrollToFormFromCart() {
      toggleCart();
      document.getElementById('order-form').scrollIntoView({ behavior: 'smooth' });
    }

    // Відправка форми на Make.com вебхук
    document.getElementById('order-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const msgDiv = document.getElementById('form-message');
      msgDiv.classList.remove('hidden');

      if (cart.length === 0) {
        msgDiv.className = "text-sm font-medium mt-2 text-red-500 text-center";
        msgDiv.innerText = "Оберіть хоча б одну позицію";
        return;
      }

      const name = document.getElementById('customer-name').value.trim();
      const email = document.getElementById('customer-email').value.trim();
      const phone = document.getElementById('customer-phone').value.trim();
      const comment = document.getElementById('customer-comment').value.trim();

      const itemsFormatted = cart.map(item => ({
        sku: item.sku,
        name: item.name,
        qty: Number(item.qty),
        price: Number(item.price),
        subtotal: Number(item.price * item.qty)
      }));

      const totalSum = itemsFormatted.reduce((sum, i) => sum + i.subtotal, 0);
      const randomId = Math.floor(100000 + Math.random() * 900000);

      const orderData = {
        order_id: "ORD-" + randomId,
        created_at: new Date().toISOString(),
        customer: {
          name: name,
          email: email,
          phone: phone
        },
        comment: comment,
        items: itemsFormatted,
        items_count: cart.reduce((sum, i) => sum + i.qty, 0),
        total: totalSum,
        currency: "UAH"
      };

      try {
        msgDiv.className = "text-sm font-medium mt-2 text-gray-400 text-center";
        msgDiv.innerText = "Відправка замовлення...";

        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(orderData)
        });

        if (response.ok) {
          msgDiv.className = "text-sm font-medium mt-2 text-brand text-center";
          msgDiv.innerText = `Дякуємо! Підтвердження надіслано на ${email}`;
          document.getElementById('order-form').reset();
          cart = [];
          updateCart();
        } else {
          throw new Error('Помилка сервера: ' + response.status);
        }
      } catch (error) {
        console.error(error);
        msgDiv.className = "text-sm font-medium mt-2 text-red-500 text-center";
        msgDiv.innerText = "Сталася помилка при відправці. Спробуйте пізніше.";
      }
    });

    renderProducts();
    updateCart();
  </script>
</body>
</html>

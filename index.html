 <!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MVRK STORE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#a3e635',
            darkbg: '#0f172a'
          }
        }
      }
    }
  </script>
  <style>
    body { user-select: none; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-200 min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur border-b border-gray-200 dark:border-slate-800">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="window.scrollTo({top:0, behavior:'smooth'})">
        <span class="w-3 h-3 rounded-full bg-brand"></span>
        <h1 class="text-xl font-extrabold tracking-wider">MVRK STORE</h1>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="toggleDarkMode()" class="p-2 rounded-full bg-gray-100 dark:bg-slate-800 text-lg">🌙</button>
        <button onclick="toggleCart()" class="bg-slate-900 dark:bg-brand dark:text-slate-950 text-white px-4 py-2 rounded-full font-bold flex items-center gap-2">
          🛒 Кошик <span id="cart-count" class="bg-brand text-slate-950 px-2 py-0.5 rounded-full text-xs font-black">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Hero Banner -->
  <section class="max-w-6xl mx-auto px-4 py-8">
    <div class="bg-slate-950 text-white rounded-3xl p-8 md:p-12 relative overflow-hidden flex flex-col justify-between min-h-[300px]">
      <div class="max-w-md z-10">
        <span class="text-xs font-bold uppercase tracking-widest text-brand bg-brand/10 px-3 py-1 rounded-full border border-brand/20">Нова колекція 2026</span>
        <h2 class="text-4xl md:text-5xl font-black mt-4 leading-tight">Одяг, який говорить сам.</h2>
        <p class="text-gray-400 mt-2">Streetwear без зайвого шуму: щільні тканини, чисті силуети.</p>
        <button onclick="scrollToCatalog()" class="mt-6 bg-brand text-slate-950 font-bold px-6 py-3 rounded-xl hover:opacity-90 transition">Дивитись колекцію ↓</button>
      </div>
    </div>
  </section>

  <!-- Catalog -->
  <main id="catalog-section" class="max-w-6xl mx-auto px-4 py-8">
    <h3 class="text-2xl font-bold mb-6">Каталог товарів</h3>
    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
  </main>

  <!-- Cart Modal -->
  <div id="cart-modal" class="fixed inset-0 bg-black/50 z-50 hidden backdrop-blur-sm flex justify-end">
    <div class="bg-white dark:bg-slate-900 w-full max-w-md h-full p-6 flex flex-col justify-between shadow-2xl">
      <div>
        <div class="flex justify-between items-center mb-6">
          <h3 class="text-xl font-bold">Ваш кошик</h3>
          <button onclick="toggleCart()" class="text-2xl">&times;</button>
        </div>
        <div id="cart-items" class="space-y-4 max-h-[60vh] overflow-y-auto"></div>
      </div>
      <div class="border-t border-gray-200 dark:border-slate-800 pt-4">
        <div class="flex justify-between font-bold text-lg mb-4">
          <span>Разом:</span>
          <span id="cart-total">0 ₴</span>
        </div>
        <button onclick="checkout()" class="w-full bg-brand text-slate-950 py-3 rounded-xl font-bold hover:opacity-90 transition">Оформити замовлення</button>
      </div>
    </div>
  </div>

  <script>
    const products = [
      { id: 1, name: "Худі MVRK Heavyweight", price: 2490, img: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=500" },
      { id: 2, name: "Світшот Basic Oversize", price: 1890, img: "https://images.unsplash.com/photo-1578587018452-892bacefd3f2?w=500" },
      { id: 3, name: "Футболка MVRK Core", price: 990, img: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500" },
      { id: 4, name: "Штани Cargo Black", price: 2190, img: "https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=500" }
    ];

    let cart = [];

    function renderProducts() {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = products.map(p => `
        <div class="bg-white dark:bg-slate-800 rounded-2xl overflow-hidden shadow-sm border border-gray-100 dark:border-slate-700/50 flex flex-col justify-between">
          <img src="${p.img}" alt="${p.name}" class="w-full h-64 object-cover">
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <h4 class="font-bold text-lg">${p.name}</h4>
              <p class="text-brand font-black text-xl mt-1">${p.price} ₴</p>
            </div>
            <button onclick="addToCart(${p.id})" class="mt-4 w-full bg-slate-900 dark:bg-brand text-white dark:text-slate-950 font-bold py-2 rounded-xl hover:opacity-90 transition">
              + В кошик
            </button>
          </div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const item = products.find(p => p.id === id);
      cart.push(item);
      updateCart();
    }

    function updateCart() {
      document.getElementById('cart-count').innerText = cart.length;
      const cartItems = document.getElementById('cart-items');
      if (cart.length === 0) {
        cartItems.innerHTML = '<p class="text-gray-400 text-center py-8">Кошик порожній</p>';
      } else {
        cartItems.innerHTML = cart.map((item, idx) => `
          <div class="flex justify-between items-center border-b border-gray-100 dark:border-slate-800 pb-2">
            <div>
              <p class="font-bold text-sm">${item.name}</p>
              <p class="text-xs text-brand font-bold">${item.price} ₴</p>
            </div>
            <button onclick="removeFromCart(${idx})" class="text-red-500 text-xs">Видалити</button>
          </div>
        `).join('');
      }
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById('cart-total').innerText = `${total} ₴`;
    }

    function removeFromCart(idx) {
      cart.splice(idx, 1);
      updateCart();
    }

    function toggleCart() {
      document.getElementById('cart-modal').classList.toggle('hidden');
    }

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
    }

    function scrollToCatalog() {
      document.getElementById('catalog-section').scrollIntoView({ behavior: 'smooth' });
    }

    function checkout() {
      if(cart.length === 0) return alert('Кошик порожній!');
      alert('Дякуємо за замовлення!');
      cart = [];
      updateCart();
      toggleCart();
    }

    renderProducts();
    updateCart();
  </script>
</body>
</html>
